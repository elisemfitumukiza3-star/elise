
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | LearnLoop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101a20;
      font-family: Arial, sans-serif;
      color: #f2f7f5;
    }
    .reset-card {
      width: 100%;
      max-width: 440px;
      padding: 35px;
      background: #202a31;
      border: 1px solid #35444d;
      border-radius: 14px;
    }
    h1 { margin-top: 0; }
    p { color: #aabac0; line-height: 1.6; }
    label { display: block; margin: 18px 0 8px; }
    input {
      width: 100%;
      padding: 14px;
      background: #000;
      color: white;
      border: 1px solid #52636b;
      border-radius: 0;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      background: #35b99e;
      color: #062820;
      font-weight: bold;
      cursor: pointer;
    }
    #message { min-height: 24px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Reset your password</h1>
    <p>Choose a new password for your LearnLoop account.</p>

    <form id="resetForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password"
        minlength="8" required autocomplete="new-password"
        placeholder="Enter your new password">

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password"
        minlength="8" required autocomplete="new-password"
        placeholder="Enter your password again">

      <button id="resetButton" type="submit">
        Update password
      </button>
    </form>

    <p id="message" role="status" aria-live="polite">
      Verifying your recovery link...
    </p>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from
      "./src/config.js";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("resetButton");

    let recoveryReady = false;

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        form.hidden = false;
        message.textContent =
          "Your recovery link is verified. Choose a new password.";
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!recoveryReady) {
        message.textContent =
          "Your recovery link is not valid. Request a new one.";
        return;
      }

      const password =
        document.getElementById("newPassword").value;
      const confirmation =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "Your password must contain at least 8 characters.";
        return;
      }

      if (password !== confirmation) {
        message.textContent =
          "The passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      const { error } = await supabase.auth.updateUser({
        password
      });

      button.disabled = false;
      button.textContent = "Update password";

      if (error) {
        message.textContent = error.message;
        return;
      }

      await supabase.auth.signOut();

      message.textContent =
        "Your password has been updated. You can now sign in to LearnLoop.";

      form.hidden = true;
    });

    setTimeout(() => {
      if (!recoveryReady) {
        message.textContent =
          "The recovery link could not be verified. Please request a new password reset email.";
      }
    }, 12000);
  </script>
</body>
</html>
